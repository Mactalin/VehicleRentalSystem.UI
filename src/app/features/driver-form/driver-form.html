<app-page-header
  [title]="isEdit ? 'Edit Driver' : 'Add New Driver'"
  subtitle="Enter the driver's details below.">
  <a routerLink="/drivers" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left me-2"></i> Back to List
  </a>
</app-page-header>

<div class="vr-card" style="max-width: 800px;">
  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
  <div class="alert alert-warning" *ngIf="notificationError">
    {{ notificationError }}
    <button type="button" class="btn btn-sm btn-outline-warning ms-3" (click)="retryNotification()" [disabled]="submitting">
      <i class="bi bi-arrow-repeat me-1"></i> Retry notification
    </button>
  </div>
  <div class="vr-spinner" *ngIf="loading"><div class="spinner-border text-primary"></div></div>

  <form (ngSubmit)="onSubmit()" *ngIf="!loading">
    <div class="row g-3">

      <div class="col-md-6">
        <label class="form-label">Full Name <span class="text-danger">*</span></label>
        <input type="text" class="form-control" [(ngModel)]="model.fullName" name="fullName" required />
      </div>

      <div class="col-md-6">
        <label class="form-label">License Number <span class="text-danger">*</span></label>
        <input type="text" class="form-control" [(ngModel)]="model.licenseNumber" name="licenseNumber" required [readonly]="isEdit" />
      </div>

      <div class="col-md-6">
        <label class="form-label">Phone <span class="text-danger">*</span></label>
        <input type="tel" class="form-control" [(ngModel)]="model.phone" name="phone" autocomplete="tel" required />
      </div>

      <div class="col-md-6">
        <label class="form-label">Email <span class="text-danger" *ngIf="!isEdit">*</span></label>
        <input type="email" class="form-control" [(ngModel)]="model.email" name="email" autocomplete="email" [required]="!isEdit" />
        <div class="form-text" *ngIf="!isEdit">A welcome email and SMS will be sent after the driver is added.</div>
      </div>

      <div class="col-md-4">
        <label class="form-label">Daily Rate (₹) <span class="text-danger">*</span></label>
        <input type="number" class="form-control" [(ngModel)]="model.chargePerDay" name="chargePerDay" required />
      </div>

      <div class="col-md-4">
        <label class="form-label">Hourly Rate (₹)</label>
        <input type="number" class="form-control" [(ngModel)]="model.chargePerHour" name="chargePerHour" />
      </div>

      <div class="col-md-4">
        <label class="form-label">Experience (Years)</label>
        <input type="number" class="form-control" [(ngModel)]="model.experienceYears" name="experienceYears" />
      </div>

      <!-- These fields only show when editing -->
      <ng-container *ngIf="isEdit">
        <div class="col-md-6">
          <label class="form-label">Status</label>
          <select class="form-select" [(ngModel)]="model.status" name="status">
            <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
          </select>
        </div>
        <div class="col-md-6 d-flex align-items-end pb-2">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" [(ngModel)]="model.isActive" name="isActive" id="isActive" />
            <label class="form-check-label" for="isActive">Driver is Active</label>
          </div>
        </div>
      </ng-container>

      <div class="col-12">
        <label class="form-label">Notes</label>
        <textarea class="form-control" [(ngModel)]="model.notes" name="notes" rows="2"></textarea>
      </div>

    </div>

    <hr class="my-4" />

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" [disabled]="submitting || !!createdDriver">
        <i class="bi bi-check2 me-2"></i> {{ isEdit ? 'Update Driver' : 'Save Driver' }}
      </button>
      <button type="button" class="btn btn-light" routerLink="/drivers">Cancel</button>
    </div>
  </form>
</div>
