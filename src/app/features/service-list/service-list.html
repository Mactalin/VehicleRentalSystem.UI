<app-page-header title="Additional Services" subtitle="Manage add-ons like GPS, child seats, and insurance.">
  <button class="btn btn-primary" (click)="openAddModal()">
    <i class="bi bi-plus-lg me-2"></i> Add Service
  </button>
</app-page-header>


<app-empty-state
  *ngIf="!loading() && services.length === 0"
  icon="bi-box"
  title="No services yet"
  message="Create your first add-on service to offer at checkout.">
</app-empty-state>

<!-- Card Grid Layout -->
<div class="row g-4" *ngIf="!loading() && services.length > 0">
  <div class="col-md-6 col-lg-4" *ngFor="let s of services">
    <div class="vr-card h-100 p-4 service-card">
      <div class="d-flex justify-content-between align-items-start mb-3">
        <div class="service-icon">
          <i class="bi" [ngClass]="getIcon(s.type)"></i>
        </div>
        <span class="vr-badge" [ngClass]="s.isActive ? 'vr-badge-success' : 'vr-badge-danger'">
          {{ s.isActive ? 'Active' : 'Disabled' }}
        </span>
      </div>

      <h4 class="mb-1">{{ s.name }}</h4>
      <div class="text-muted small mb-3">{{ s.type }}</div>
      <p class="small text-muted mb-4 flex-grow-1">{{ s.description || 'No description provided.' }}</p>

      <div class="d-flex justify-content-between align-items-center mt-auto">
        <div class="fw-bold fs-5">₹{{ s.price }}</div>
        <div>
          <button class="btn btn-sm btn-light me-2" (click)="openEditModal(s)"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-light text-danger" (click)="delete(s.id)"><i class="bi bi-trash"></i></button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Custom Modal -->
<div class="vr-modal-backdrop" *ngIf="showModal">
  <div class="vr-modal">
    <div class="vr-modal-header">
      <h3>{{ isEdit ? 'Edit Service' : 'Add Service' }}</h3>
      <button class="btn-close" (click)="closeModal()"></button>
    </div>

    <div class="vr-modal-body">
      <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

      <div class="mb-3">
        <label class="form-label">Service Name</label>
        <input type="text" class="form-control" [(ngModel)]="model.name" placeholder="e.g. Portable GPS" />
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" [(ngModel)]="model.description" rows="2"></textarea>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-6">
          <label class="form-label">Price (₹)</label>
          <input type="number" class="form-control" [(ngModel)]="model.price" />
        </div>
        <div class="col-6">
          <label class="form-label">Type</label>
          <select class="form-select" [(ngModel)]="model.type">
            <option *ngFor="let t of serviceTypes" [value]="t">{{ t }}</option>
          </select>
        </div>
      </div>

      <div class="form-check mb-3" *ngIf="isEdit">
        <input class="form-check-input" type="checkbox" [(ngModel)]="model.isActive" id="isActive" />
        <label class="form-check-label" for="isActive">Available for booking</label>
      </div>
    </div>

    <div class="vr-modal-footer">
      <button class="btn btn-light" (click)="closeModal()">Cancel</button>
      <button class="btn btn-primary" (click)="save()" [disabled]="submitting || !model.name">
        {{ submitting ? 'Saving...' : 'Save Service' }}
      </button>
    </div>
  </div>
</div>
